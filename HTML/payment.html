    <h2>Client Bank Details</h2>
    <div class="Card">
        <form action="">
            <div class="row">
            <div class="input-box">
                <span>Client Name:</span>
                <input type="text" placeholder="Neo Sipho">
            </div>
            <div class="input-box">
                <span>Bank Card Name:</span>
                <input type="text" placeholder="NS Mshumpela">
                </div>
                <div class="input-box">
                    <span>Identity Number:</span>
                    <input type="text" placeholder="1234567890">
                </div>
                <div class="input-box">
                    <span>Bank type</span>
                    <input type="text" placeholder="Little Tree House">
                </div>
                <div class="input-box">
                    <span>Security Code</span>
                    <input type="text" placeholder="123" maxlength="3">
                </div>
                <button><b>submit</b></button>

            </div>
        </form>
    </div>
