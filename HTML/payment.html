    <section>
        
        <form>
            <h3 id="payment-title" >Client Details</h3>

            <div class="card-details">
            <div class="details">
                <label for="clientName">Client Name</label><br>
                <input type="text" id="client-name" placeholder="John">
            

            <div class="details">
              <label for="clientSurname">Surname</label><br>
              <input type="text"  id="client-surname" placeholder="Peterson">
             

                <div class="details">
                    <label for="cardBranch">Branch</label><br>
                <input type="text" id="card-branch" placeholder="First National Bank">
                

                <div class="details">
                     <label for="cardType">Debit/Credit Card</label><br>
                    <input type="text" id="card-type" placeholder="Optional">
            

                <div class="details">
                     <label for="cardNumber">Card Number</label><br>
                    <input type="text" id="card-number" placeholder="12345678910">
                

                <div class="details">
                     <label for="security">Security Code</label><br>
                    <input type="password" id="security-code" placeholder="123" maxlength="3">
                </div>

                <button id="payment-btn">Submit</button>

</div>
